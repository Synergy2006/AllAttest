# Deploys the AllAttest API (the server/ folder) to Azure App Service.
#   prod branch -> allattest       (production, www.allattest.com)
#   main branch -> allattest-dev   (dev)
# Each environment has its own publish-profile secret in GitHub
# (Settings -> Secrets and variables -> Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE      (prod app)
#   AZURE_WEBAPP_PUBLISH_PROFILE_DEV  (dev app)
name: Deploy API to Azure

on:
  push:
    branches: [main, prod]
    paths:
      - "server/**"
      - ".github/workflows/deploy-api-to-azure.yml"
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: ${{ github.ref_name == 'prod' && 'allattest' || 'allattest-dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        working-directory: server
        run: npm install --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ github.ref_name == 'prod' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE || secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: server
